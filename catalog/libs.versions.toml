# =============================================================================
# CMP Fleet — Shared Version Catalog
# =============================================================================
# Published as a Gradle version catalog (import via settings.gradle.kts) and
# usable as a plain reference. See README.md for both consumption modes and
# KNOWN-GOOD.md for the verified toolchain-compatibility matrix.
#
# TIER 1 (below "Toolchain" … "Publishing"): build-verified on Kotlin 2.3.21 by
#         two shipping apps (AdaptiveVol, cmp-template).
# TIER 2 ([UNVERIFIED] section at the bottom): candidate libraries only used by
#         apps still on older Kotlin. Build once on 2.3.21 before trusting.
# =============================================================================

[versions]
# ---- Toolchain (verified) ----
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.10"                 # KSP2, tracks Kotlin 2.3.x
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# ---- Compose (verified) ----
composeBom = "2026.06.01"
composeMultiplatform = "1.11.1"
cmpMaterial3 = "1.9.0"         # versioned independently of CMP since 1.10
cmpMaterialIcons = "1.7.3"     # frozen upstream — final MP release
jbNavigation = "2.9.2"
jbLifecycle = "2.10.0"

# ---- AndroidX (verified; capped for AGP 8.13 / compileSdk 36) ----
coreKtx = "1.18.0"             # 1.19 needs AGP 9.1 / compileSdk 37
lifecycle = "2.10.0"          # 2.11 needs AGP 9.1 / compileSdk 37
activityCompose = "1.13.0"
multidex = "2.0.1"
work = "2.11.2"

# ---- Kotlinx (verified) ----
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"
coroutines = "1.11.0"

# ---- DI / functional / logging (verified) ----
koin = "4.2.2"
arrow = "2.2.2.1"             # newest whose iOS klib ABI <= Kotlin 2.3.0
timber = "5.0.1"

# ---- Data (verified) ----
room = "2.8.4"
sqlite = "2.6.2"

# ---- Testing (verified) ----
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestExtTruth = "1.7.0"
espresso = "3.7.0"
orchestrator = "1.6.1"
roborazzi = "1.70.0"
robolectric = "4.15.1"        # @Config(sdk=35) — tops out at SDK 35 shadows

# ---- Quality / publishing (verified) ----
detekt = "1.23.8"
playPublisher = "3.13.0"      # last 3.x; 4.0 drops AGP < 9

# ---- [UNVERIFIED on Kotlin 2.3.21] — see KNOWN-GOOD.md before promoting ----
ktor = "3.1.3"
coil3 = "3.2.0"
kotest = "5.9.1"
gitliveFirebase = "2.1.0"
firebaseBom = "33.13.0"
googleServices = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.3"
compottie = "2.0.0-rc04"
filekit = "0.10.0-beta02"
uriKmp = "0.0.19"
bouquet = "1.0.0"
biometric = "1.1.0"
securityCrypto = "1.1.0-alpha07"
okhttpLogging = "4.12.0"
coreI18n = "1.0.0"

[libraries]
