name: Publish catalog

# Publishes the version catalog to GitHub Packages when a version tag is pushed.
# Tag format: v<calendar-version>, e.g. `v2026.07.0`.
#   git tag v2026.07.0 && git push origin v2026.07.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        # GITHUB_ACTOR is already a default env var in Actions (do NOT set it —
        # the GITHUB_ prefix is reserved and setting it fails workflow startup).
        # GITHUB_TOKEN is the one whitelisted exception and must be mapped.
        run: ./gradlew publish -PcatalogVersion=${{ steps.version.outputs.value }} --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
